version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ai-sdk:
        patterns:
          - ai
          - '@ai-sdk/*'
      chat-sdk:
        patterns:
          - chat
          - '@chat-adapter/*'
      hono:
        patterns:
          - hono
          - '@hono/*'
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - vitest
          - '@vitest/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
