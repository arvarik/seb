version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      chat-sdk:
        patterns:
          - chat
          - '@chat-adapter/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
