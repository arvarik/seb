name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: npm run version:check && npm run lint && npm run typecheck && npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package release archive
        run: npm pack

      - name: Publish to npm registry
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notice if NPM_TOKEN is missing
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::NPM_TOKEN secret is not configured in repository secrets; skipped npm registry publish. Add NPM_TOKEN in repository secrets to enable automated npm publishing."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and push Docker image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ github.ref_name }}"
          docker build -t "$IMAGE_NAME:$VERSION" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:latest"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes *.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
